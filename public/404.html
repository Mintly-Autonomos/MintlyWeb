<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada · Mintly</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7faf9;
        --fg: #14211d;
        --muted: #5b6b66;
        --mint: #0f7a5c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1614;
          --fg: #e8f0ed;
          --muted: #9db0aa;
          --mint: #5fd3ab;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      .code {
        font-size: 64px;
        font-weight: 800;
        color: var(--mint);
        margin: 0;
        letter-spacing: -0.02em;
      }
      h1 {
        font-size: 22px;
        margin: 8px 0;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 20px;
      }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--mint);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 3px solid var(--fg);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Página não encontrada</h1>
      <p>O endereço não existe ou mudou. Volte para a Visão Geral e continue de lá.</p>
      <a href="/">Ir para o Mintly</a>
    </main>
  </body>
</html>
