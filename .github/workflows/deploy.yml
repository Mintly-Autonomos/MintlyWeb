name: MintlyWeb Deploy

# Deploy manual. O AMBIENTE decide a nuvem (igual ao MintlyApi):
#   environment = staging    -> Vercel (o projeto atual, slot "production" da Vercel: o endereço estável)
#   environment = production -> AWS (S3 + CloudFront)
# Não há input de nuvem: staging é sempre Vercel e production é sempre AWS, o que evita combinações
# erradas (ex.: subir production na Vercel por engano). Não existe staging na AWS.
#
# A BRANCH do código é a escolhida no topo do "Run workflow" (Use workflow from): é ela que o checkout baixa.
# Os dois ambientes exigem aprovação (required reviewers do environment do GitHub).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy (staging -> Vercel, production -> AWS)
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      confirm_deploy:
        description: Confirm that you want to run this deployment
        required: true
        default: false
        type: boolean

concurrency:
  group: mintlyweb-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify-inputs:
    name: Confirm deployment request
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm_deploy }}" != "true" ]; then
            echo "Deployment cancelled because confirm_deploy was not checked."
            exit 1
          fi

      - name: Print deployment summary
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Branch: ${{ github.ref_name }}"
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "Destination: AWS (S3 + CloudFront)"
          else
            echo "Destination: Vercel"
          fi

  deploy-vercel:
    name: Deploy to Vercel (staging)
    needs: verify-inputs
    if: ${{ inputs.environment == 'staging' }}
    runs-on: ubuntu-latest
    environment: staging

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # URL real da API (não-sensível — vars, não secrets). Sem isso, o build usa
      # o valor commitado no environment.production.ts (apiUrl) como fallback.
      API_URL: ${{ vars.API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Configure API URL
        run: |
          FILE="src/environments/environment.production.ts"
          if [ -n "$API_URL" ]; then
            sed -i "s|apiUrl: '[^']*'|apiUrl: '$API_URL'|" "$FILE"
            echo "apiUrl definida via vars.API_URL: $API_URL"
          else
            echo "vars.API_URL não setada — mantendo o valor commitado em $FILE"
          fi

      # O que a Vercel serve é o build de produção (otimizado), no slot "production" do projeto.
      - name: Application build
        run: npm run build:ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-aws:
    name: Deploy to AWS (production)
    needs: verify-inputs
    if: ${{ inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
      DIST_PATH: dist/mintly-front-end/browser
      # URL real da API (não-sensível — vars, não secrets). Sem isso, o build usa
      # o valor commitado no environment.production.ts (apiUrl) como fallback.
      API_URL: ${{ vars.API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Configure API URL
        run: |
          FILE="src/environments/environment.production.ts"
          if [ -n "$API_URL" ]; then
            sed -i "s|apiUrl: '[^']*'|apiUrl: '$API_URL'|" "$FILE"
            echo "apiUrl definida via vars.API_URL: $API_URL"
          else
            echo "vars.API_URL não setada — mantendo o valor commitado em $FILE"
          fi

      - name: Application build
        run: npm run build:ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload build to S3
        run: aws s3 sync ${{ env.DIST_PATH }} s3://${{ env.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
